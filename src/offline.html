<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ITLab Store</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #ffffff;

        }


        body {

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

        }


        .container {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 22px;

            width: 90%;

            max-width: 650px;

        }


        /* =================================
           LOGO
           ================================= */

        .logo {

            width: 260px;

            max-width: 70%;

            user-select: none;

            -webkit-user-drag: none;

        }


        /* =================================
           ICON
           ================================= */

        .icon {

            width: 80px;

            height: 80px;

            border-radius: 50%;

            background: #f1f1f1;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 38px;

            margin-top: 5px;

            animation:
                pulse 2s infinite;

        }


        @keyframes pulse {

            0% {

                transform: scale(1);

                opacity: 1;

            }

            50% {

                transform: scale(1.08);

                opacity: 0.65;

            }

            100% {

                transform: scale(1);

                opacity: 1;

            }

        }


        /* =================================
           TEXT
           ================================= */

        h1 {

            font-size: 32px;

            font-weight: 600;

            color: #222;

        }


        p {

            font-size: 19px;

            line-height: 1.5;

            color: #666;

            max-width: 560px;

        }


        /* =================================
           STATUS
           ================================= */

        .status {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-top: 5px;

            padding: 13px 24px;

            border-radius: 10px;

            background: #f4f4f4;

            color: #555;

            font-size: 16px;

            min-width: 280px;

        }


        .dot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: #999;

            animation:
                blink 1.5s infinite;

        }


        @keyframes blink {

            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }

        }


        /* =================================
           FOOTER
           ================================= */

        .footer {

            margin-top: 10px;

            font-size: 14px;

            color: #999;

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- LOGO -->

        <img
            class="logo"
            src="logo.png"
            alt="ITLab Store"
        >


        <!-- ICON -->

        <div class="icon">

            🌐

        </div>


        <!-- TITLE -->

        <h1>

            Brak połączenia z Internetem

        </h1>


        <!-- DESCRIPTION -->

        <p>

            Nie można połączyć się ze sklepem.
            Sprawdzamy połączenie automatycznie.

        </p>


        <!-- STATUS -->

        <div class="status">

            <span class="dot"></span>

            <span>

                Oczekiwanie na połączenie...

            </span>

        </div>


        <!-- FOOTER -->

        <div class="footer">

            Sklep zostanie automatycznie przywrócony
            po odzyskaniu połączenia.

        </div>


    </div>


</body>

</html>
